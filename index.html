<title>Bora Falar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&family=Noto+Sans:wght@400;700&display=swap">
<style>
:root {
  --bg: #EDF1EB;
  --surface: #FFFFFF;
  --surface-2: #E2E9E2;
  --ink: #13221B;
  --ink-2: #4B5C53;
  --ink-3: #7C8C83;
  --deep: #13221B;
  --line: #CBD5CD;
  --accent: #D9481C;
  --accent-deep: #A8340F;
  --on-accent: #FFFFFF;
  --gold: #F2B01E;
  --gold-deep: #C88A00;
  --good: #0B7A57;
  --good-bg: #DDF1E8;
  --bad: #C22F3A;
  --bad-bg: #FBE3E4;
  --shadow: 0 1px 2px rgba(19,34,27,.06), 0 8px 24px rgba(19,34,27,.08);
  --display: "Fredoka", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ipa: "Noto Sans", "Charis SIL", "Doulos SIL", "Gentium Plus", "Lucida Sans Unicode", "Segoe UI", system-ui, sans-serif;
  --r: 16px;
  color-scheme: light;
}
/* Dia é o padrão. O modo noite só liga pelo Ajustes (data-mode no <html>). */
:root[data-mode="night"] {
  color-scheme: dark;
  --bg: #0C1410; --surface: #15201A; --surface-2: #1D2A23; --ink: #E7EEE9; --ink-2: #A3B5AA; --ink-3: #74867B; --deep: #24342B;
  --line: #2A3A31; --accent: #FF6B3D; --accent-deep: #C9481F; --on-accent: #1A0B05; --gold: #FFC23D; --gold-deep: #C98F14;
  --good: #3CC795; --good-bg: #123427; --bad: #FF6570; --bad-bg: #3A171B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { overflow-x: hidden; color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: 0; }
h1 { font-size: 1.75rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--ink-3); }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-inner { position: relative; max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0; margin-right: auto; background: none; border: 0; padding: 0; display: flex; align-items: baseline; gap: 2px; }
.brand b { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; font-size: .95rem; white-space: nowrap; flex: none; }
@media (max-width: 440px) {
  .top-inner { gap: 5px; }
  .brand { font-size: 1rem; }
  .chip { height: 34px; padding: 0 8px; font-size: .88rem; gap: 4px; }
  .chip .goal-max { display: none; }
  .icon-btn { width: 34px; height: 34px; }
}
@media (max-width: 370px) { .brand { display: none; } .top-inner > .chip:first-of-type { margin-left: auto; } }

/* música de fundo */
.music-btn { color: var(--ink-2); }
.music-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.music-btn .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
.music-btn .eq i { display: block; width: 3px; height: 100%; background: currentColor; border-radius: 2px; transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
.music-btn .eq i:nth-child(1) { animation-delay: -.3s; }
.music-btn .eq i:nth-child(3) { animation-delay: -.6s; }
.music-btn.playing .note { display: none; }
.music-btn.playing .eq { display: flex; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.music-pop { position: absolute; top: calc(100% + 4px); right: 16px; z-index: 45; width: min(340px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px; animation: rise .2s ease-out; }
.switch { position: relative; flex: none; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"] span { transform: translateX(22px); }
.track { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.track .e { font-size: 1.5rem; }
.track .check { color: var(--accent); font-weight: 900; visibility: hidden; }
.track[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.track[aria-pressed="true"] .check { visibility: visible; }
.vol-row { display: flex; align-items: center; gap: 8px; }
.vol-row input { flex: 1; min-width: 0; accent-color: var(--accent); }
.vol-row output { min-width: 4ch; text-align: right; font-weight: 800; }
.chip.flame.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.chip.level { font-family: var(--display); font-size: .8rem; }
.icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.ring { width: 22px; height: 22px; }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }

/* Calçadão de Copacabana */
.wave { display: block; width: 100%; height: 14px; }
.wave path { fill: var(--ink); }
.wave-big { height: 34px; }

main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .grid2.wrap1 { grid-template-columns: 1fr; } }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 700; color: var(--ink-3); }
.nav svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }
body.focus .nav { display: none; }
body.focus main { padding-bottom: 32px; }

/* ---------- surfaces & buttons ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel.tight { padding: 14px; }
.btn { --b: var(--accent); --bd: var(--accent-deep); --t: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 14px; border: 0; background: var(--b); color: var(--t); font-weight: 800; font-size: .95rem; text-transform: uppercase; letter-spacing: .06em;
  box-shadow: 0 4px 0 var(--bd); transform: translateY(0); transition: transform .08s, box-shadow .08s, filter .15s; text-decoration: none; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bd); }
.btn:disabled { --b: var(--surface-2); --bd: var(--line); --t: var(--ink-3); cursor: not-allowed; filter: none; }
.btn.ghost { --b: var(--surface); --bd: var(--line); --t: var(--ink); border: 1px solid var(--line); }
.btn.good { --b: var(--good); --bd: color-mix(in srgb, var(--good) 70%, #000); --t: #fff; }
.btn.bad { --b: var(--bad); --bd: color-mix(in srgb, var(--bad) 70%, #000); --t: #fff; }
.btn.gold { --b: var(--gold); --bd: var(--gold-deep); --t: #231800; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .9rem; border-radius: 11px; box-shadow: 0 3px 0 var(--bd); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.speak { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0; flex: none; }
.speak svg { width: 20px; height: 20px; }
.speak.lg { width: 64px; height: 64px; background: var(--accent); color: var(--on-accent); border: 0; box-shadow: 0 4px 0 var(--accent-deep); }
.speak.lg svg { width: 30px; height: 30px; }
.speak.playing { animation: pulse 1s ease-in-out infinite; }
.say { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; margin: 0 1px; border-radius: 8px; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); color: inherit; font-weight: 700; }
.say svg { width: 14px; height: 14px; color: var(--accent); }
@keyframes pulse { 50% { transform: scale(1.08); } }

.bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .5s ease; }
.bar.good > i { background: var(--good); }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 16px; font-weight: 700; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); animation: toastIn .35s cubic-bezier(.2,1.4,.4,1); max-width: 420px; }
.toast .e { font-size: 1.5rem; }
@keyframes toastIn { from { transform: translateY(20px) scale(.9); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(8,14,11,.55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .2s; }
@media (min-width: 620px) { .modal-back { align-items: center; } }
.modal { background: var(--surface); color: var(--ink); border-radius: 22px; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; padding: 22px; box-shadow: var(--shadow); animation: rise .3s cubic-bezier(.2,1.2,.4,1); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

/* ---------- home ---------- */
.hello { display: flex; flex-direction: column; gap: 4px; }
.goal { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.goal .big-ring { width: 96px; height: 96px; position: relative; }
.goal .big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.goal .big-ring circle { fill: none; stroke-width: 10; }
.goal .big-ring .track { stroke: var(--surface-2); }
.goal .big-ring .fill { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.goal .big-ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1; }
.goal .big-ring .mid small { display: block; font-family: var(--body); font-size: .7rem; font-weight: 700; color: var(--ink-3); margin-top: 3px; }
.week { display: flex; gap: 6px; margin-top: 10px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; color: var(--ink-3); }
.week .dot { width: 26px; height: 26px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; }
.week .dot.act { background: color-mix(in srgb, var(--gold) 45%, var(--surface-2)); }
.week .dot.met { background: var(--gold); color: #231800; }
.week .d.today { color: var(--ink); }
.week .d.today .dot { outline: 2px solid var(--ink); outline-offset: 1px; }
.next-card { border-radius: var(--r); padding: 18px; color: #fff; background: var(--u, var(--accent)); display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; position: relative; overflow: hidden; }
.next-card .e { font-size: 3rem; line-height: 1; }
.next-card .label { color: rgba(255,255,255,.8); }
.next-card h2 { color: #fff; margin-top: 4px; }
.next-card .btn { --b: #fff; --bd: rgba(0,0,0,.25); --t: #13221B; margin-top: 12px; }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.plan li:first-child { border-top: 0; }
.plan .tick { width: 24px; height: 24px; border-radius: 999px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: transparent; }
.plan li.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.plan li.done .what { text-decoration: line-through; color: var(--ink-3); }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; transition: transform .12s, border-color .12s; }
.tile:hover { transform: translateY(-2px); border-color: var(--ink-3); }
.tile .e { font-size: 1.6rem; }
.tile b { font-size: 1rem; }
.phrase { display: flex; gap: 12px; align-items: center; }
.phrase q { font-family: var(--display); font-weight: 500; font-size: 1.1rem; quotes: "“" "”"; }

/* ---------- trilha ---------- */
.unit { display: flex; flex-direction: column; gap: 14px; }
.unit-head { background: var(--u); color: #fff; border-radius: var(--r); padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
.unit-head .e { font-size: 1.8rem; }
.unit-head h2 { color: #fff; }
.unit-head .label { color: rgba(255,255,255,.8); }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 0 12px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 18px 0 0; width: 150px; }
.node .disc { width: 76px; height: 76px; border-radius: 999px; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; font-size: 2rem; box-shadow: 0 5px 0 var(--line); transition: transform .12s; }
.node:hover .disc { transform: translateY(-2px); }
.node.done .disc { background: var(--u); border-color: var(--u); box-shadow: 0 5px 0 color-mix(in srgb, var(--u) 65%, #000); }
.node.next .disc { border-color: var(--u); box-shadow: 0 5px 0 var(--u); animation: bob 1.6s ease-in-out infinite; }
.node .name { font-weight: 700; font-size: .9rem; text-align: center; line-height: 1.2; }
.node .stars { font-size: .8rem; letter-spacing: 1px; color: var(--gold-deep); height: 1em; }
.node .go { position: absolute; top: -6px; z-index: 1; background: var(--u); color: #fff; font-size: .68rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.cefr > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 14px 12px 14px 14px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 3px 0 var(--line); }
.cefr > summary::-webkit-details-marker { display: none; }
.cefr > summary:hover { background: var(--surface-2); }
.lv-badge { flex: none; width: 56px; height: 56px; border-radius: 16px; background: var(--lv); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.35rem; box-shadow: 0 4px 0 color-mix(in srgb, var(--lv) 60%, #000); }
.cefr.soon .lv-badge { background: var(--surface-2); color: var(--ink-3); box-shadow: 0 4px 0 var(--line); }
.lv-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lv-top { display: flex; align-items: baseline; gap: 8px; }
.lv-name { font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.15; }
.lv-count { margin-left: auto; font-size: .8rem; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv-soon { margin-left: auto; font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
.lv-desc { font-size: .88rem; color: var(--ink-2); line-height: 1.35; }
.lv-bar { height: 8px; margin-top: 6px; }
.lv-bar > i { background: var(--lv); }
.lv-body { display: flex; flex-direction: column; gap: 22px; padding: 18px 0 8px; }
.lv-can { border-left: 4px solid var(--lv); background: var(--surface); border-radius: 0 14px 14px 0; padding: 12px 14px; }
.cefr.soon .lv-can { border-left-color: var(--line); }
.lv-can ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .92rem; }
.lv-can li { display: flex; gap: 8px; }
.lv-can li::before { content: "✓"; color: var(--lv); font-weight: 800; }
.cefr.soon .lv-can li::before { content: "•"; color: var(--ink-3); }
.lv-note { text-align: center; color: var(--ink-3); font-size: .9rem; border: 2px dashed var(--line); border-radius: var(--r); padding: 14px; }

/* ---------- lição ---------- */
.lesson-top { display: flex; align-items: center; gap: 12px; }
.lesson-top .bar { flex: 1; height: 14px; }
.combo { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.prompt { font-family: var(--display); font-weight: 600; font-size: 1.45rem; line-height: 1.3; }
.big-emoji { font-size: 4.2rem; line-height: 1; text-align: center; }
.word-hero { font-family: var(--display); font-weight: 600; font-size: 2.3rem; letter-spacing: 0; text-align: center; line-height: 1.1; }
.ctx { display: inline-flex; gap: 8px; align-items: flex-start; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .95rem; color: var(--ink-2); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; box-shadow: 0 3px 0 var(--line); display: flex; gap: 12px; align-items: center; transition: transform .08s; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--ink-3); }
.opt:active { transform: translateY(2px); }
.opt:disabled { color: inherit; opacity: 1; cursor: default; }
.opt.sel { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.opt.right { border-color: var(--good); box-shadow: 0 3px 0 var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); background: var(--bad-bg); }
.opt.emoji { justify-content: center; font-size: 2.4rem; padding: 12px; }
.opts.four-emoji { grid-template-columns: repeat(2, 1fr); }
.blank { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
.answer-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; align-content: flex-start; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile-w { background: var(--surface); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); border-radius: 12px; padding: 8px 14px; font-size: 1.05rem; font-weight: 700; }
.tile-w.used { visibility: hidden; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .opt { justify-content: center; min-height: 58px; }
.match .opt.done { opacity: .35; pointer-events: none; }
.type-in { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 1.1rem; }
